name: Release

# On every push to main: when the version in package.json has no vX.Y.Z tag yet,
# test that exact commit, build the web archive and the desktop packages
# (Windows NSIS, Linux AppImage, .deb and pacman), then tag the commit and publish the release.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  check:
    if: github.repository == '1002-AZ-2001/Silicon-Empire'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether this version is already tagged
        id: version
        shell: bash
        run: |
          version="$(jq -r .version package.json)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version invalide dans package.json : $version"
            exit 1
          fi
          tag="v$version"
          tags="$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name')"
          if grep -qxF "$tag" <<< "$tags"; then
            echo "Le tag $tag existe déjà : rien à publier."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check the release notes in CHANGELOG.md
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v heading="## $VERSION" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md n'a pas de section « ## $VERSION »."
            exit 1
          fi

  verify:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install, lint, typecheck, unit tests and build
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Browser tests on the built site
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm exec playwright test --trace off

      - name: Package the tested web build
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: (cd dist && zip -qrX "../Silicon-Empire-$TAG-web.zip" .)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: Silicon-Empire-*-web.zip
          if-no-files-found: error

  desktop:
    needs: [check, verify]
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2025
            platform: --win
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: ubuntu-24.04
            platform: --linux
            files: |
              release/*.AppImage
              release/*.deb
              release/*.pacman
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install the pacman packaging tool
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Build the desktop packages
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm desktop:compile
          pnpm exec electron-builder ${{ matrix.platform }} --publish never

      - name: Launch the packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop --trace off

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ runner.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish:
    needs: [check, verify, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
          merge-multiple: true

      - name: Tag the tested commit and publish the release
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          awk -v heading="## $VERSION" 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' \
            CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          cd assets
          sha256sum -- * > "$RUNNER_TEMP/Silicon-Empire-$TAG.sha256"
          mv "$RUNNER_TEMP/Silicon-Empire-$TAG.sha256" .
          cat "Silicon-Empire-$TAG.sha256"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Silicon Empire $TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest \
            -- *

      - name: Verify the published files
        shell: bash
        env:
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)" = "$GITHUB_SHA"
          mkdir "$RUNNER_TEMP/published"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/published"
          cd "$RUNNER_TEMP/published"
          sha256sum -c "Silicon-Empire-$TAG.sha256"
          unzip -tq "Silicon-Empire-$TAG-web.zip"
