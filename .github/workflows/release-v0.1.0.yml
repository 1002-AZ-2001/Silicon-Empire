name: Publish Silicon Empire v0.1.0

on:
  push:
    branches: [release/v0.1.0]

concurrency: silicon-empire-v0.1.0

permissions:
  contents: write

jobs:
  release:
    if: github.repository == '1002-AZ-2001/Silicon-Empire'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify the tagged version and publish the tested build
        working-directory: .github/release-assets/v0.1.0
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag_commit="$(gh api "repos/${GH_REPO}/commits/v0.1.0" --jq .sha)"
          test "$tag_commit" = 87c0ec8f2ffbfdbeabca1f1dd7c3342cc8d849b1
          sha256sum -c Silicon-Empire-v0.1.0.sha256
          unzip -tq Silicon-Empire-v0.1.0.zip
          gh release create v0.1.0 Silicon-Empire-v0.1.0.zip Silicon-Empire-v0.1.0.sha256 \
            --verify-tag --title 'Silicon Empire v0.1.0' --notes-file notes-v0.1.0.md --latest
